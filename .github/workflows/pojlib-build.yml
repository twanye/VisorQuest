# Builds the Pojlib Android library (AAR) from Pojlib/.
# Added by Hark for VisorQuest. Build only: a green run means it compiles, not that it works on a Quest.
name: Build Pojlib

on:
  workflow_dispatch:
  push:
    paths:
      - 'Pojlib/**'
      - '.github/workflows/pojlib-build.yml'
  pull_request:
    paths:
      - 'Pojlib/**'
      - '.github/workflows/pojlib-build.yml'

permissions:
  contents: read

concurrency:
  group: pojlib-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Pojlib

    steps:
      - name: Checkout (with Git LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Fail if any native .so is still an LFS pointer
        run: |
          bad=0
          while IFS= read -r f; do
            if head -c 40 "$f" | grep -q "git-lfs.github.com/spec"; then
              echo "::error file=Pojlib/$f::still a Git LFS pointer, not a real library"
              bad=1
            fi
          done < <(git ls-files '*.so')
          exit $bad

      - name: Set up JDK 8 (lwjgl jar toolchain) and JDK 11 (Android Gradle Plugin 7.4)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            11

      - name: Install Android SDK parts (NDK r26b, build-tools 30.0.3, platform 34)
        working-directory: .
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;26.1.10909125" "build-tools;30.0.3" "platforms;android-34" > /dev/null

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build AAR (debug + release)
        run: |
          chmod +x ./gradlew
          ./gradlew assemble --stacktrace -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_11_X64

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: pojlib-aar-${{ github.sha }}
          path: Pojlib/build/outputs/aar/*.aar
          if-no-files-found: error
