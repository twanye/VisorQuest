// Build script of every ":visor-fabric:<mc>" subproject.
plugins {
    id "visor.loader"
}

def fabricApiVersion = "${fabric_api_version}+${minecraft_version}"

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modApi "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
    // WorldPreloader (coah80/Visor 32c80265) talks to Chunky's API; Chunky itself is installed by the launcher
    compileOnly files(rootProject.file('libs/Chunky-1.3.146.jar'))

    // Natives
    if (questBuild) {
        // Quest: QuestCraft's LWJGL OpenXR 3.3.3 (Android classes, no desktop natives). Ported from coah80/Visor a0275017.
        include(implementation(name: "lwjgl-openxr-quest-3.3.3"))
    } else {
        include(implementation("org.lwjgl:lwjgl-openxr:${lwjgl_version}") { transitive = false })
        include(implementation("org.lwjgl:lwjgl-openxr:${lwjgl_version}:natives-linux") { transitive = false })
        include(implementation("org.lwjgl:lwjgl-openxr:${lwjgl_version}:natives-linux-arm64") { transitive = false })
        include(implementation("org.lwjgl:lwjgl-openxr:${lwjgl_version}:natives-windows") { transitive = false })
    }
    // Quest: no lwjgl-vulkan 3.3.6 nested jar. Pojlib runs LWJGL 3.3.3 and the Android path is OpenGL ES only
    // (AtumVR XRInstance.resolveGraphicsApi forces OPENGL when XRPlatform uses the Android bridge).
    if (bundlesVulkan && !questBuild) {
        include(implementation("org.lwjgl:lwjgl-vulkan:${lwjgl_version}") { transitive = false })
    }

    //Fabric
    include(modImplementation(fabricApi.module("fabric-api-base", fabricApiVersion)))
    include(modImplementation(fabricApi.module("fabric-resource-loader-v0", fabricApiVersion)))
    include(modImplementation(fabricApi.module("fabric-command-api-v2", fabricApiVersion)))
}

loom {
    injectAccessWidener(modJar)
}
